<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IM Copilot - 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 48px 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .login-card h1 { font-size: 24px; color: #1a1a1a; margin-bottom: 8px; }
        .login-card p { color: #666; font-size: 14px; margin-bottom: 32px; }
        .login-btn {
            display: inline-block;
            background: #1976d2;
            color: #fff;
            padding: 14px 40px;
            border-radius: 24px;
            text-decoration: none;
            font-size: 16px;
            transition: background 0.2s;
        }
        .login-btn:hover { background: #1565c0; }
        .error-msg { color: #d32f2f; font-size: 13px; margin-bottom: 16px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>IM Copilot</h1>
        <p>使用飞书账号登录以继续</p>
        {% if error %}
        <div class="error-msg">{{ error }}</div>
        {% endif %}
        <a href="{{ login_url }}" class="login-btn">飞书登录</a>
    </div>
</body>
</html>
